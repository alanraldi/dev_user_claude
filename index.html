<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>π e a Circunferência</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #07080f;
      font-family: Georgia, serif;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 60px;
    }
    h1 {
      font-size: 5rem;
      color: #f5a623;
      text-shadow: 0 0 40px rgba(245,166,35,0.55);
      line-height: 1;
      margin-bottom: 6px;
    }
    .sub {
      color: #556;
      font-size: 1rem;
      letter-spacing: 1.5px;
      margin-bottom: 28px;
      text-align: center;
    }
    .card {
      background: #0d1020;
      border: 1px solid #1e2540;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 760px;
    }
    canvas { display: block; width: 100%; }
    #lbl {
      text-align: center;
      margin-top: 14px;
      min-height: 22px;
      font-size: 0.95rem;
      color: #7788aa;
      letter-spacing: 0.5px;
    }
    .formula-card {
      margin-top: 20px;
      background: #0d1020;
      border: 1px solid #1e2540;
      border-radius: 12px;
      padding: 20px 28px;
      text-align: center;
      max-width: 760px;
      width: 100%;
    }
    .formula-card .f { font-size: 1.55rem; letter-spacing: 2px; color: #ccd; }
    .formula-card .f .pi { color: #f5a623; }
    .formula-card .note { margin-top: 8px; color: #556; font-size: 0.85rem; }
    .btn {
      margin-top: 20px;
      border: 2px solid #f5a623;
      background: transparent;
      color: #f5a623;
      padding: 9px 32px;
      border-radius: 28px;
      font-size: 1rem;
      font-family: Georgia, serif;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s, color 0.2s;
    }
    .btn:hover { background: #f5a623; color: #07080f; }
    .digits {
      margin-top: 22px;
      color: #3a7a5a;
      font-size: 0.9rem;
      letter-spacing: 2.5px;
      text-align: center;
      max-width: 700px;
      line-height: 2;
    }
    .digits .dp { color: #f5a623; font-size: 1.2rem; }
  </style>
</head>
<body>

<h1>π</h1>
<div class="sub">quantas vezes o diâmetro cabe na circunferência?</div>

<div class="card">
  <canvas id="c" width="720" height="330"></canvas>
  <div id="lbl"></div>
</div>

<div class="formula-card">
  <div class="f">C = <span class="pi">π</span> × d &nbsp;=&nbsp; 2<span class="pi">π</span>r</div>
  <div class="note">π é exatamente quantas vezes o diâmetro cabe na circunferência</div>
</div>

<button class="btn" onclick="restart()">↺ Repetir animação</button>

<div class="digits">
  <span class="dp">π</span> = 3.14159 26535 89793 23846 26433 83279 50288 41971...
</div>

<script>
  const cv  = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const W   = 720, H = 330;

  // ── Layout ────────────────────────────────────────────────────────────────
  const R   = 68;           // circle radius (px)
  const CX  = 118, CY = 158; // circle centre
  const D   = 2 * R;        // diameter = 136 px
  const C   = Math.PI * D;  // circumference ≈ 427.3 px

  // Unrolled line
  const LX0 = 236;          // line start x
  const LY  = 255;          // line y
  // line end: 236 + 427 = 663 — fits inside 720 ✓

  // Segment colours: 1d, 2d, 3d, remainder
  const SEG = [
    { label: '1 × d', color: '#4fc3f7' },
    { label: '2 × d', color: '#4aaa88' },
    { label: '3 × d', color: '#f5a623' },
    { label: `+0.14… × d`, color: '#ff5060' },
  ];
  // Segment x-ranges on the line
  const segs = [
    [LX0,         LX0 + D    ],
    [LX0 + D,     LX0 + 2*D  ],
    [LX0 + 2*D,   LX0 + 3*D  ],
    [LX0 + 3*D,   LX0 + C    ],
  ];

  // ── State ─────────────────────────────────────────────────────────────────
  const PHASES = ['circle','unroll','measure','done'];
  let phaseIdx = 0;
  let t        = 0;   // 0→1 within each phase
  const DUR    = [70, 110, 160, Infinity]; // frames per phase

  let rafId;

  function ease(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  // ── Draw helpers ─────────────────────────────────────────────────────────
  function drawGrid(){
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 1;
    for(let x=0;x<W;x+=40){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke(); }
    for(let y=0;y<H;y+=40){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }
  }

  function drawCircle(alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    // glow
    const g = ctx.createRadialGradient(CX,CY,R*0.5,CX,CY,R*1.5);
    g.addColorStop(0,'rgba(79,195,247,0)');
    g.addColorStop(1,'rgba(79,195,247,0.05)');
    ctx.beginPath(); ctx.arc(CX,CY,R*1.5,0,Math.PI*2);
    ctx.fillStyle=g; ctx.fill();
    // circle
    ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2);
    ctx.strokeStyle='#4fc3f7'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.restore();
  }

  function drawDiameter(alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    // horizontal diameter
    ctx.beginPath();
    ctx.moveTo(CX-R, CY);
    ctx.lineTo(CX+R, CY);
    ctx.strokeStyle='#f5a623'; ctx.lineWidth=2; ctx.stroke();
    // arrowheads
    arrowHead(CX-R, CY, -1);
    arrowHead(CX+R, CY,  1);
    // label d
    ctx.fillStyle='#f5a623'; ctx.font='bold 14px Georgia';
    ctx.textAlign='center';
    ctx.fillText('d = 2r', CX, CY-12);
    // label r (half)
    ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(CX,CY-R); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='13px Georgia';
    ctx.textAlign='left';
    ctx.fillText('r', CX+5, CY-R/2+5);
    // centre dot
    ctx.beginPath(); ctx.arc(CX,CY,3.5,0,Math.PI*2);
    ctx.fillStyle='#4fc3f7'; ctx.fill();
    ctx.restore();
  }

  function arrowHead(x,y,dir){
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x-dir*10, y-5);
    ctx.lineTo(x-dir*10, y+5);
    ctx.closePath();
    ctx.fillStyle='#f5a623'; ctx.fill();
  }

  function drawArc(progress){
    // orange arc growing from top, clockwise, proportional to progress
    const startA = -Math.PI/2;
    const endA   = startA + Math.PI*2*progress;
    ctx.beginPath();
    ctx.arc(CX, CY, R, startA, endA);
    ctx.strokeStyle='#f5a623'; ctx.lineWidth=4; ctx.stroke();
  }

  function drawLine(len, alpha){
    if(len<=0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(LX0, LY);
    ctx.lineTo(LX0+len, LY);
    ctx.strokeStyle='#4fc3f7'; ctx.lineWidth=3; ctx.stroke();
    // start cap label
    ctx.fillStyle='rgba(79,195,247,0.7)'; ctx.font='12px Georgia'; ctx.textAlign='center';
    ctx.fillText('início', LX0, LY+18);
    ctx.restore();
  }

  function drawSegments(progress){
    // progress 0→1 fills segments one by one
    const totalLen = C;
    const filled   = totalLen * progress;

    for(let i=0;i<4;i++){
      const [x0,x1] = segs[i];
      const segLen   = x1 - x0;
      const drawn    = clamp(filled - (x0-LX0), 0, segLen);
      if(drawn <= 0) continue;

      // segment fill
      ctx.beginPath();
      ctx.moveTo(x0, LY);
      ctx.lineTo(x0+drawn, LY);
      ctx.strokeStyle = SEG[i].color; ctx.lineWidth=5; ctx.stroke();

      // tick + label at segment start (except seg 0)
      if(i>0){
        ctx.strokeStyle=SEG[i-1].color; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(x0,LY-10); ctx.lineTo(x0,LY+10); ctx.stroke();
      }

      // label above when segment fully drawn
      if(drawn >= segLen - 1){
        ctx.fillStyle = SEG[i].color;
        ctx.font = 'bold 12px Georgia';
        ctx.textAlign = 'center';
        const mx = x0 + segLen/2;
        ctx.fillText(SEG[i].label, mx, LY-14);
      }
    }

    // end tick
    const endX = LX0 + clamp(filled, 0, C);
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(endX,LY-10); ctx.lineTo(endX,LY+10); ctx.stroke();
  }

  function drawBraceAndLabel(alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    // brace below line
    const y = LY + 28;
    ctx.strokeStyle='rgba(245,166,35,0.7)'; ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(LX0, y); ctx.lineTo(LX0, y+8);
    ctx.moveTo(LX0, y+8); ctx.lineTo(LX0+C, y+8);
    ctx.moveTo(LX0+C, y+8); ctx.lineTo(LX0+C, y);
    ctx.stroke();
    ctx.fillStyle='#f5a623'; ctx.font='bold 14px Georgia';
    ctx.textAlign='center';
    ctx.fillText('C = π × d', LX0+C/2, y+25);
    ctx.restore();
  }

  function drawCounterOnCircle(progress){
    // show how many "d"s have been peeled, inside circle
    const count = (progress * Math.PI).toFixed(2);
    ctx.fillStyle='rgba(245,166,35,0.9)'; ctx.font='bold 18px Georgia';
    ctx.textAlign='center';
    ctx.fillText(count, CX, CY+8);
    ctx.font='11px Georgia'; ctx.fillStyle='rgba(245,166,35,0.6)';
    ctx.fillText('× d', CX, CY+24);
  }

  // ── Labels per phase ──────────────────────────────────────────────────────
  const PHASE_LABELS = [
    'Um círculo com diâmetro d = 2r',
    'Desenrolando a circunferência em linha reta…',
    'Quantos diâmetros cabem? Exatamente π = 3.14159… vezes!',
    'C = π × d — o diâmetro cabe π vezes na circunferência.',
  ];

  // ── Main draw ─────────────────────────────────────────────────────────────
  function draw(){
    ctx.clearRect(0,0,W,H);
    drawGrid();

    const ph   = PHASES[phaseIdx];
    const prog = ease(clamp(t,0,1));

    if(ph === 'circle'){
      drawCircle(prog);
      drawDiameter(prog);
      document.getElementById('lbl').textContent = PHASE_LABELS[0];
    }

    if(ph === 'unroll'){
      drawCircle(1);
      drawDiameter(1);
      drawArc(prog);
      drawLine(prog * C, 1);
      drawCounterOnCircle(prog);
      document.getElementById('lbl').textContent = PHASE_LABELS[1];
    }

    if(ph === 'measure' || ph === 'done'){
      drawCircle(1);
      drawDiameter(1);
      drawArc(1);
      // after unroll, keep the plain line faint and overlay segments
      drawLine(C, 0.2);
      const sp = ph==='done' ? 1 : prog;
      drawSegments(sp);
      if(ph==='done' || prog > 0.85) drawBraceAndLabel(ph==='done'?1:(prog-0.85)/0.15);
      document.getElementById('lbl').textContent = PHASE_LABELS[ph==='done'?3:2];
    }
  }

  // ── Loop ─────────────────────────────────────────────────────────────────
  function tick(){
    draw();
    t += 1 / DUR[phaseIdx];
    if(t >= 1){
      t = 0;
      if(phaseIdx < PHASES.length - 1) phaseIdx++;
    }
    if(PHASES[phaseIdx] !== 'done') rafId = requestAnimationFrame(tick);
    else draw(); // final static frame
  }

  function restart(){
    cancelAnimationFrame(rafId);
    phaseIdx = 0; t = 0;
    rafId = requestAnimationFrame(tick);
  }

  restart();
</script>
</body>
</html>
