<head>

<title>AVENGERS × π</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050810;font-family:'Courier New',monospace;color:#ccd;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 60px;overflow-x:hidden}
#bgc{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;width:100%;max-width:780px;display:flex;flex-direction:column;align-items:center;gap:16px}

header{text-align:center;width:100%}
.title{font-size:clamp(1.5rem,5vw,2.5rem);font-weight:bold;letter-spacing:8px;color:#e53935;text-shadow:0 0 24px rgba(229,57,53,.7);text-transform:uppercase}
.sub{font-size:clamp(.6rem,2vw,.8rem);letter-spacing:3px;color:#f5a623;text-transform:uppercase;margin-top:6px}
.hr{width:300px;height:1px;background:linear-gradient(to right,transparent,#e53935,transparent);margin:10px auto}
.hdr-btns{display:flex;gap:10px;justify-content:center;margin-top:6px}
.hdr-btn{background:transparent;border:1px solid rgba(229,57,53,.6);color:#e53935;padding:4px 16px;border-radius:3px;font-size:.7rem;font-family:'Courier New',monospace;letter-spacing:2px;cursor:pointer;transition:all .2s}
.hdr-btn:hover{background:#e53935;color:#fff}

.card{background:rgba(5,8,18,.92);border:1px solid rgba(229,57,53,.3);border-radius:8px;padding:20px;width:100%;position:relative}
.card::before,.card::after{content:'';position:absolute;width:15px;height:15px;border-color:#e53935;border-style:solid}
.card::before{top:7px;left:7px;border-width:2px 0 0 2px}
.card::after{bottom:7px;right:7px;border-width:0 2px 2px 0}
.card.strange{border-color:rgba(123,31,162,.5)}
.card.strange::before,.card.strange::after{border-color:#7b1fa2}
.card-title{font-size:clamp(.65rem,1.8vw,.75rem);letter-spacing:3px;color:#f5a623;text-transform:uppercase;margin-bottom:14px;text-align:center}
.card.strange .card-title{color:#ce93d8}

canvas{display:block;width:100%;height:auto}

.friday{margin-top:12px;font-size:clamp(.7rem,2vw,.8rem);color:#f5a623;letter-spacing:.5px;min-height:18px;text-align:center}
.friday::before{content:'FRIDAY: ';color:#e53935}
.strange-ai{margin-top:12px;font-size:clamp(.7rem,2vw,.8rem);color:#ce93d8;letter-spacing:.5px;min-height:18px;text-align:center}
.strange-ai::before{content:'WONG: ';color:#7b1fa2}

.badges{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.badge{border:1px solid;border-radius:3px;padding:4px 11px;font-size:clamp(.6rem,1.8vw,.72rem);letter-spacing:1px;opacity:.22;transition:opacity .4s,box-shadow .4s;text-transform:uppercase}
.badge.on{opacity:1}
.b0,.a0{border-color:#e53935;color:#e53935}.b0.on,.a0.on{box-shadow:0 0 8px rgba(229,57,53,.5)}
.b1,.a1{border-color:#1565c0;color:#64b5f6}.b1.on,.a1.on{box-shadow:0 0 8px rgba(100,181,246,.5)}
.b2,.a2{border-color:#f5a623;color:#f5a623}.b2.on,.a2.on{box-shadow:0 0 8px rgba(245,166,35,.5)}
.b3,.a3{border-color:#2e7d32;color:#66bb6a}.b3.on,.a3.on{box-shadow:0 0 8px rgba(102,187,106,.5)}
.s0{border-color:#ab47bc;color:#ce93d8}.s0.on{box-shadow:0 0 8px rgba(171,71,188,.5)}
.s1{border-color:#ff6f00;color:#ffb300}.s1.on{box-shadow:0 0 8px rgba(255,111,0,.5)}
.s2{border-color:#00838f;color:#4dd0e1}.s2.on{box-shadow:0 0 8px rgba(0,131,143,.5)}

.fcard{background:rgba(5,8,18,.92);border:1px solid rgba(229,57,53,.22);border-radius:8px;padding:16px 20px;text-align:center;width:100%}
.fcard .f{font-size:clamp(.85rem,3vw,1.25rem);letter-spacing:2px}
.fcard .pi{color:#f5a623}.fcard .pu{color:#ce93d8}
.fcard .note{margin-top:6px;font-size:clamp(.62rem,1.8vw,.72rem);color:#334;letter-spacing:.5px}

.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:2px solid #e53935;background:transparent;color:#e53935;padding:7px 20px;border-radius:4px;font-size:clamp(.65rem,2vw,.78rem);font-family:'Courier New',monospace;letter-spacing:2px;cursor:pointer;text-transform:uppercase;transition:all .2s}

.digits{color:#1e2535;font-size:clamp(.65rem,2vw,.75rem);letter-spacing:2px;text-align:center}

.refs-title{font-size:clamp(.55rem,1.6vw,.65rem);letter-spacing:3px;color:rgba(229,57,53,.5);text-transform:uppercase;margin-bottom:6px}
.refs-body{font-size:clamp(.62rem,1.8vw,.72rem);color:#7a8eaa;line-height:1.8}
.refs a{color:#f5a623;text-decoration:none}

  for(let i=0;i<3;i++) setText('s'+i,l.s[i]);
  setText('msg1',l.f1[Math.min(ph1,4)]); setText('ex1',l.e1[Math.min(ph1,4)]);

// ═══════════════════════════════════════════════
// SOUND SYSTEM
// ═══════════════════════════════════════════════
const Sound={
  ctx:null, muted:true,
  // — Task 7.1: hum do Reator Arc —
  _humOsc:null, _humGain:null, _lfoOsc:null, _lfoGain:null,
  _startHum(){
    if(!this.ctx||this.ctx.state!=='running')return;
    if(this._humOsc)return; // já rodando
    try{
      // oscilador principal: frequência grave tipo reator
      this._humOsc=this.ctx.createOscillator();
      this._humGain=this.ctx.createGain();
      this._humOsc.type='triangle';
      this._humOsc.frequency.value=72; // 72 Hz — grave, dentro de 60–90 Hz
      this._humGain.gain.value=0.055;  // ≤ 0.07 conforme spec
      this._humOsc.connect(this._humGain);
      this._humGain.connect(this.ctx.destination);
      // LFO para variação orgânica (~0.5 Hz) modulando a frequência do hum
      this._lfoOsc=this.ctx.createOscillator();
      this._lfoGain=this.ctx.createGain();
      this._lfoOsc.type='sine';
      this._lfoOsc.frequency.value=0.5; // 0.5 Hz — pulsação lenta
      this._lfoGain.gain.value=4;       // desvio de ±4 Hz na frequência do hum
      this._lfoOsc.connect(this._lfoGain);
      this._lfoGain.connect(this._humOsc.frequency);
      this._humOsc.start();
      this._lfoOsc.start();
    }catch(e){}
  },
  _stopHum(){
    try{ if(this._humOsc){ this._humOsc.stop(); this._humOsc.disconnect(); this._humOsc=null; } }catch(e){}
    try{ if(this._humGain){ this._humGain.disconnect(); this._humGain=null; } }catch(e){}
    try{ if(this._lfoOsc){ this._lfoOsc.stop(); this._lfoOsc.disconnect(); this._lfoOsc=null; } }catch(e){}
    try{ if(this._lfoGain){ this._lfoGain.disconnect(); this._lfoGain=null; } }catch(e){}
  },
  toggle(){
    this.muted=!this.muted;
    const btn=document.getElementById('soundBtn');
    if(this.muted){
      btn.textContent='🔇 SOM';
      this._stopHum(); // para hum imediatamente
      return;
    }
    btn.textContent='🔊 SOM';
    // AudioContext só pode ser criado/resumido dentro de um evento de clique
    if(!this.ctx) this.ctx=new(window.AudioContext||window.webkitAudioContext)();
    this.ctx.resume().then(()=>{
      this._play(520,.12,.2,'sine'); // beep de confirmação
      this._startHum();              // inicia hum após beep
    });
  },
  _play(freq,dur,vol,type,delay){
    if(!this.ctx||this.ctx.state!=='running')return;
    try{
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.connect(g); g.connect(this.ctx.destination);
      o.type=type||'square'; o.frequency.value=freq;
      const t=this.ctx.currentTime+(delay||0);
      g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.start(t); o.stop(t+dur);
    }catch(e){}
  },
  tone(freq,dur,vol,type,delay){
    if(this.muted||!this.ctx||this.ctx.state!=='running')return;
    this._play(freq||440,dur||.12,vol||.18,type||'square',delay||0);
  },
  boot(){ [220,330,440,660].forEach((f,i)=>this.tone(f,.08,.15,'square',i*.07)); },
  segment(i){ [330,440,550,220].forEach((f,j)=>this.tone(f*(1+i*.12),.15,.2,'sine',j*.03)); },
  barTone(k){ this.tone(300+k*30,.09,.12,'sine'); },
  complete(){ [440,550,660,880].forEach((f,i)=>this.tone(f,.22,.25,'sine',i*.1)); },
  mystical(){ [180,270,360,540].forEach((f,i)=>this.tone(f,.3,.15,'triangle',i*.15)); },
};

// — Task 7.1: pausar/retomar hum com visibilidade da aba —
document.addEventListener('visibilitychange',()=>{
  if(Sound.muted||!Sound.ctx)return;
  if(document.hidden){
    Sound._stopHum();
  } else {
    Sound.ctx.resume().then(()=>{ if(!document.hidden) Sound._startHum(); });
  }
});

// ═══════════════════════════════════════════════
// BACKGROUND
// ═══════════════════════════════════════════════
;(function(){
  const bg=document.getElementById('bgc'),bx=bg.getContext('2d');
  function resize(){ bg.width=innerWidth; bg.height=innerHeight; }
  resize(); window.addEventListener('resize',resize);
  const pts=Array.from({length:32},()=>({
    x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,
    r:Math.random()*1.7+.4,c:Math.random()<.5?'229,57,53':'245,166,35',ph:Math.random()*6.28
  }));
  let f=0;
  function loop(){
    bx.clearRect(0,0,bg.width,bg.height);
    const S=42,cols=Math.ceil(bg.width/(S*1.73))+2,rows=Math.ceil(bg.height/(S*1.5))+2;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const hx=c*S*1.73+(r%2?S*.865:0),hy=r*S*1.5;
      bx.beginPath();
      for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);i?bx.lineTo(hx+S*Math.cos(a),hy+S*Math.sin(a)):bx.moveTo(hx+S*Math.cos(a),hy+S*Math.sin(a));}
      bx.closePath();
      bx.strokeStyle=`rgba(229,57,53,${.009+.005*Math.sin(f*.017+c*.3+r*.5)})`; bx.lineWidth=.5; bx.stroke();
    }
    for(const p of pts){
      p.x=(p.x+p.vx+bg.width)%bg.width; p.y=(p.y+p.vy+bg.height)%bg.height;
      bx.beginPath(); bx.arc(p.x,p.y,p.r,0,Math.PI*2);
      bx.fillStyle=`rgba(${p.c},${.1+.2*Math.sin(f*.04+p.ph)})`; bx.fill();
    }

// ═══════════════════════════════════════════════
function ease(t){ return t<.5?2*t*t:-1+(4-2*t)*t; }
function cl(v,a,b){ return Math.max(a,Math.min(b,v)); }
const SC=['#e53935','#1976d2','#f5a623','#43a047'];

function drawReactor(ctx,cx,cy,r,gl){
  const g=.35+.2*Math.sin(gl*.06);
  const og=ctx.createRadialGradient(cx,cy,r*.7,cx,cy,r*2);
  og.addColorStop(0,`rgba(79,195,247,${g*.12})`); og.addColorStop(1,'transparent');
  ctx.beginPath(); ctx.arc(cx,cy,r*2,0,Math.PI*2); ctx.fillStyle=og; ctx.fill();
  for(const[rr,op] of [[1,.6+g*.3],[.74,.35+g*.2],[.49,.45+g*.3]]){
    ctx.beginPath(); ctx.arc(cx,cy,r*rr,0,Math.PI*2);
    ctx.strokeStyle=`rgba(79,195,247,${op})`; ctx.lineWidth=2; ctx.stroke();
  }
  for(let i=0;i<3;i++){
    const a=(i/3)*Math.PI*2-Math.PI/2+gl*.002;
    const x1=cx+Math.cos(a)*r*.22,y1=cy+Math.sin(a)*r*.22;
    const x2=cx+Math.cos(a)*r*.7,y2=cy+Math.sin(a)*r*.7;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.strokeStyle=`rgba(79,195,247,${.5+g*.2})`; ctx.lineWidth=1.5; ctx.stroke();
    const b=a+Math.PI*2/3;
    ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(cx+Math.cos(b)*r*.5,cy+Math.sin(b)*r*.5);
    ctx.strokeStyle=`rgba(79,195,247,${.18+g*.1})`; ctx.lineWidth=1; ctx.stroke();
  }
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,r*.26);
  cg.addColorStop(0,`rgba(140,230,255,${.7+g*.25})`);
  cg.addColorStop(.6,`rgba(79,195,247,${.35+g*.15})`);
  cg.addColorStop(1,'transparent');
  ctx.beginPath(); ctx.arc(cx,cy,r*.26,0,Math.PI*2); ctx.fillStyle=cg; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,3,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
}

function drawPortal(ctx,cx,cy,r,gl){
  const g=.3+.25*Math.sin(gl*.05);
  // outer glow purple
  const og=ctx.createRadialGradient(cx,cy,r*.6,cx,cy,r*2);
  og.addColorStop(0,`rgba(123,31,162,${g*.15})`); og.addColorStop(1,'transparent');
  ctx.beginPath(); ctx.arc(cx,cy,r*2,0,Math.PI*2); ctx.fillStyle=og; ctx.fill();
  // spinning rings
  for(let i=0;i<4;i++){
    const rr=r*(1-i*.18), speed=(i%2?1:-1)*gl*.004, dash=6+i*2;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(speed);
    ctx.beginPath(); ctx.arc(0,0,rr,0,Math.PI*2);
    ctx.setLineDash([dash,dash]); ctx.lineDashOffset=gl*(i%2?1:-1);
    ctx.strokeStyle=i%2===0?`rgba(123,31,162,${.6+g*.3})`:`rgba(255,111,0,${.5+g*.25})`;
    ctx.lineWidth=1.8; ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  }
  // core (golden eye of agamotto)
  const ig=ctx.createRadialGradient(cx,cy,0,cx,cy,r*.3);
  ig.addColorStop(0,`rgba(255,200,50,${.8+g*.2})`);
  ig.addColorStop(.5,`rgba(200,100,255,${.4+g*.2})`);
  ig.addColorStop(1,'transparent');
  ctx.beginPath(); ctx.arc(cx,cy,r*.3,0,Math.PI*2); ctx.fillStyle=ig; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,3,0,Math.PI*2); ctx.fillStyle='#ffe082'; ctx.fill();
  // sparks
  for(let i=0;i<6;i++){
    const a=i/6*Math.PI*2+gl*.03, dist=r*(0.7+.3*Math.sin(gl*.07+i));
    ctx.beginPath(); ctx.arc(cx+Math.cos(a)*dist,cy+Math.sin(a)*dist,2,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,${111+i*20},0,${.5+.4*Math.sin(gl*.1+i)})`; ctx.fill();
  }
}

// SEÇÃO 3 — SÉRIE DE LEIBNIZ
// ═══════════════════════════════════════════════
const cv3=document.getElementById('c3'),x3=cv3.getContext('2d');
const W3=720,H3=256,R3=62,CX3=106,CY3=125;
const NTERMS=15;
const BAR_W=26,BAR_GAP=3,BX0=210,BBASE=148,BSCALE=115;
const TARGET_Y=BBASE-Math.PI/4*BSCALE; // y position of π/4 line
const DUR3=[50,70,180,100]; let ph3=0,t_3=0,gl3=0,id3,done3=false;
let barsDone=0; // tracks how many bars have appeared

function leibTerm(k){ return (k%2===0?1:-1)/(2*k+1); }
function leibSum(n){ let s=0; for(let k=0;k<n;k++) s+=leibTerm(k); return s; }

function drawBars(progress){
  // progress 0→1 over DUR3[2] frames — bars appear sequentially
  const numVisible=Math.floor(progress*NTERMS);
  const partialProg=progress*NTERMS-numVisible;
  let runSum=0;

  for(let k=0;k<NTERMS;k++){
    const term=leibTerm(k);
    const x0=BX0+k*(BAR_W+BAR_GAP);
    const barH=Math.abs(term)*BSCALE;
    const isPos=term>0;
    const col=isPos?'#ab47bc':'#ff6f00';

    let drawH;
    if(k<numVisible) drawH=barH;
    else if(k===numVisible) drawH=barH*ease(partialProg);
    else continue;

    runSum+=term;
    const y0=isPos?BBASE-drawH:BBASE;

    // bar fill
    x3.save(); x3.shadowBlur=8; x3.shadowColor=col;
    x3.fillStyle=col; x3.globalAlpha=.75; x3.fillRect(x0,y0,BAR_W,drawH); x3.restore();
    x3.strokeStyle=col; x3.lineWidth=1.5; x3.strokeRect(x0,y0,BAR_W,drawH);

    // label on full bars
    if(k<numVisible){
      x3.fillStyle=col; x3.font='9px Courier New'; x3.textAlign='center';
      const lbl=k===0?'+1':(isPos?`+1/${2*k+1}`:`-1/${2*k+1}`);
      x3.fillText(lbl,x0+BAR_W/2,isPos?y0-4:y0+drawH+12);

      // badge activation
      if(isPos && !document.getElementById('s0').classList.contains('on')){ document.getElementById('s0').classList.add('on'); }
      if(!isPos && !document.getElementById('s1').classList.contains('on')){ document.getElementById('s1').classList.add('on'); }

      // sound on new bar
      if(k>=barsDone){ Sound.barTone(k); barsDone=k+1; }
    }
  }

  // running sum indicator
  const sumY=BBASE-runSum*BSCALE;
  x3.save(); x3.shadowBlur=6; x3.shadowColor='#ffe082';
  x3.beginPath(); x3.arc(BX0+(Math.min(numVisible,NTERMS-1))*(BAR_W+BAR_GAP)+BAR_W/2,sumY,5,0,Math.PI*2);
  x3.fillStyle='#ffe082'; x3.fill(); x3.restore();

  // target line π/4
  x3.save(); x3.setLineDash([6,4]);
  x3.strokeStyle='rgba(255,224,130,.45)'; x3.lineWidth=1.2;
  x3.beginPath(); x3.moveTo(BX0,TARGET_Y); x3.lineTo(BX0+NTERMS*(BAR_W+BAR_GAP),TARGET_Y); x3.stroke();
  x3.setLineDash([]); x3.fillStyle='rgba(255,224,130,.7)'; x3.font='10px Courier New'; x3.textAlign='left';
  x3.fillText('π/4 ≈ 0.785',BX0+NTERMS*(BAR_W+BAR_GAP)+4,TARGET_Y+4); x3.restore();

  // baseline
  x3.strokeStyle='rgba(255,255,255,.15)'; x3.lineWidth=1;
  x3.beginPath(); x3.moveTo(BX0-5,BBASE); x3.lineTo(BX0+NTERMS*(BAR_W+BAR_GAP)+60,BBASE); x3.stroke();

  return runSum;
}

function drawResult(a, runSum){
  if(a<=0)return;
  x3.save(); x3.globalAlpha=a;
  const piApprox=(runSum*4);
  x3.fillStyle='#ffe082'; x3.font='bold 14px Courier New'; x3.textAlign='center';
  x3.fillText(`soma parcial × 4 = ${piApprox.toFixed(5)}`,BX0+NTERMS*(BAR_W+BAR_GAP)/2,BBASE+50);
  x3.fillStyle='#ce93d8'; x3.font='bold 16px Courier New';
  x3.fillText('π = 4 × (1 − 1/3 + 1/5 − …) = 3.14159…',W3/2,BBASE+72);
  document.getElementById('s2').classList.add('on');
  x3.restore();
}

function frame3(){
  x3.clearRect(0,0,W3,H3); gl3++;
  x3.fillStyle='rgba(123,31,162,.5)'; x3.font='9px Courier New'; x3.textAlign='left'; x3.fillText('KAMAR-TAJ // WONG AI v2.0',10,14);
  x3.fillStyle='rgba(255,111,0,.38)'; x3.textAlign='right'; x3.fillText(`FASE ${ph3+1}/5`,W3-10,14);
  const p=ease(cl(t_3,0,1));

  if(ph3===0){
    x3.save(); x3.globalAlpha=p;
    const y=H3*p,sg=x3.createLinearGradient(0,y,W3,y);
    sg.addColorStop(0,'transparent'); sg.addColorStop(.5,'rgba(123,31,162,.5)'); sg.addColorStop(1,'transparent');
    x3.beginPath(); x3.moveTo(0,y); x3.lineTo(W3,y); x3.strokeStyle=sg; x3.lineWidth=2; x3.stroke();
    if(Math.sin(p*28)>0){ x3.fillStyle='rgba(255,111,0,.7)'; x3.font='bold 12px Courier New'; x3.textAlign='center'; x3.fillText('PORTAL DE KAMAR-TAJ — SÉRIE INFINITA',W3/2,H3/2); }
    x3.restore();
  }
  if(ph3>=1) drawPortal(x3,CX3,CY3,R3,gl3);
  if(ph3===1){
    // formula fades in
    x3.save(); x3.globalAlpha=p;
    x3.fillStyle='#ce93d8'; x3.font='bold 13px Courier New'; x3.textAlign='center';
    x3.fillText('π/4 = 1 − 1/3 + 1/5 − 1/7 + 1/9 − …',W3/2,CY3+R3+28);
    // axis
    x3.strokeStyle='rgba(255,255,255,.12)'; x3.lineWidth=1;
    x3.beginPath(); x3.moveTo(BX0,BBASE-BSCALE-10); x3.lineTo(BX0,BBASE+10); x3.stroke();
    x3.beginPath(); x3.moveTo(BX0-5,BBASE); x3.lineTo(BX0+NTERMS*(BAR_W+BAR_GAP)+20,BBASE); x3.stroke();
    x3.restore();
  }
  if(ph3>=2){
    // show axis
    x3.strokeStyle='rgba(255,255,255,.12)'; x3.lineWidth=1;
    x3.beginPath(); x3.moveTo(BX0,BBASE-BSCALE-10); x3.lineTo(BX0,BBASE+10); x3.stroke();
    // formula label
    x3.fillStyle='rgba(206,147,216,.6)'; x3.font='11px Courier New'; x3.textAlign='center';
    x3.fillText('π/4 = 1 − 1/3 + 1/5 − 1/7 + …',W3/2,H3-12);
    const barProg=ph3===2?p:1;
    const runSum=drawBars(barProg);
    if(ph3>=3) drawResult(ph3===3?cl((p-.5)/.5,0,1):1, runSum>0?runSum:leibSum(NTERMS));
  }
  if(ph3>=1) drawPortal(x3,CX3,CY3,R3,gl3); // redraw portal on top
}

function tick3(){ frame3(); t_3+=1/DUR3[ph3]; if(t_3>=1){ t_3=0; if(ph3<4) ph3++; if(ph3===4){ done3=true; Sound.complete(); } setText('msg3',L().f3[ph3]||L().f3[4]); setText('ex3',L().e3[ph3]||L().e3[4]); } id3=requestAnimationFrame(ph3<4?tick3:loop3); }
function loop3(){ frame3(); id3=requestAnimationFrame(loop3); }
function restart3(){ cancelAnimationFrame(id3); ph3=0; t_3=0; done3=false; barsDone=0; ['s0','s1','s2'].forEach(id=>document.getElementById(id).classList.remove('on')); setText('msg3',L().f3[0]); setText('ex3',L().e3[0]); Sound.mystical(); id3=requestAnimationFrame(tick3); }

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
applyLang();
restart1();
setTimeout(()=>restart2(),600);
setTimeout(()=>restart3(),1200);

// ═══════════════════════════════════════════════
// TASK 7.2 — MODO APRESENTAÇÃO: NAVEGAÇÃO POR TECLADO
// ═══════════════════════════════════════════════
document.addEventListener('keydown',function(e){
  // Não captura quando o foco está em input, textarea ou button
  const tag=(document.activeElement||{}).tagName||'';
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='BUTTON') return;

  const isForward  = e.code==='Space'||e.code==='ArrowRight';
  const isBackward = e.code==='ArrowLeft'||e.code==='Backspace';
  if(!isForward&&!isBackward) return;

  // Previne scroll da página ao pressionar Espaço/ArrowLeft/ArrowRight/Backspace
  e.preventDefault();

  if(isForward){
    // Determina qual seção avançar:
    // Seção 1 tem prioridade enquanto não estiver done; depois 2; depois 3
    if(!done1){
      _advanceSection(1);
    } else if(!done2){
      _advanceSection(2);
    } else if(!done3){
      _advanceSection(3);
    }
    // Se todas done: não faz nada (sem loop infinito)
  } else {
    // Retroceder: trata seção mais avançada que ainda não chegou a done,
    // ou a última seção se todas done
    if(!done3&&ph3>0){
      _rewindSection(3);
    } else if(!done2&&ph2>0){
      _rewindSection(2);
    } else if(!done1&&ph1>0){
      _rewindSection(1);
    } else if(done3){
      // Todas concluídas: retrocede seção 3 reiniciando
      restart3();
    } else if(done2){
      restart2();
    } else if(done1){
      restart1();
    }
  }
});

// Avança a seção indicada (1, 2 ou 3) para a próxima fase
function _advanceSection(sec){
  if(sec===1){
    if(done1)return;
    cancelAnimationFrame(id1);
    if(ph1<4){ ph1++; t_1=0; }
    if(ph1>=4){ ph1=4; done1=true; Sound.complete(); }
    setText('msg1',L().f1[Math.min(ph1,4)]); setText('ex1',L().e1[Math.min(ph1,4)]);
    id1=requestAnimationFrame(done1?loop1:tick1);
  } else if(sec===2){
    if(done2)return;
    cancelAnimationFrame(id2);
    if(ph2<4){ ph2++; t_2=0; }
    if(ph2>=4){ ph2=4; done2=true; Sound.complete(); }
    setText('msg2',L().f2[Math.min(ph2,4)]); setText('ex2',L().e2[Math.min(ph2,4)]);
    id2=requestAnimationFrame(done2?loop2:tick2);
  } else if(sec===3){
    if(done3)return;
    cancelAnimationFrame(id3);
    if(ph3<4){ ph3++; t_3=0; }
    if(ph3>=4){ ph3=4; done3=true; Sound.complete(); }
    setText('msg3',L().f3[Math.min(ph3,4)]); setText('ex3',L().e3[Math.min(ph3,4)]);
    id3=requestAnimationFrame(done3?loop3:tick3);
  }
}

// Recua a seção indicada para a fase anterior (sem reiniciar a seção do zero)
function _rewindSection(sec){
  if(sec===1){
    cancelAnimationFrame(id1);
    if(ph1>0){ ph1--; t_1=0; done1=false; }
    setText('msg1',L().f1[ph1]); setText('ex1',L().e1[ph1]);
    id1=requestAnimationFrame(tick1);
  } else if(sec===2){
    cancelAnimationFrame(id2);
    if(ph2>0){ ph2--; t_2=0; done2=false; }
    setText('msg2',L().f2[ph2]); setText('ex2',L().e2[ph2]);
    id2=requestAnimationFrame(tick2);
  } else if(sec===3){
    cancelAnimationFrame(id3);
    if(ph3>0){ ph3--; t_3=0; done3=false; }
    setText('msg3',L().f3[ph3]); setText('ex3',L().e3[ph3]);
    id3=requestAnimationFrame(tick3);
  }
}
